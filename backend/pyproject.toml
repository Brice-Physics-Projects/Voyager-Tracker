[project]
name = "voyager-tracker"
version = "0.1.0"
description = "Python API for Voyager spacecraft positions, mission imagery, and history."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "httpx2>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voyager_tracker"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ipython>=9.17.1",
    "ruff>=0.17.6",
    "pyright>=1.1.414",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.12"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "UP",    # pyupgrade (modern syntax for the target version)
    "B",     # flake8-bugbear (likely bugs)
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "PT",    # flake8-pytest-style
    "ASYNC", # flake8-async (blocking calls in async code)
    "FAST",  # FastAPI-specific rules
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["voyager_tracker"]

[tool.ruff.format]
docstring-code-format = true
